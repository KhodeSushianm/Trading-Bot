name: Build Android APK

on:
  push:
    branches: [ "android" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "android" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3

    - name: Create Gradle Wrapper
      run: |
        cd android
        mkdir -p gradle/wrapper
        cat > gradle/wrapper/gradle-wrapper.properties << PROPS
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
PROPS
        curl -L -o gradle/wrapper/gradle-wrapper.jar \
          "https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar"
        cat > gradlew << 'SCRIPT'
#!/bin/sh
APP_HOME=$(cd "$(dirname "$0")" && pwd -P)
CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
if [ -n "$JAVA_HOME" ] ; then
    JAVACMD="$JAVA_HOME/bin/java"
else
    JAVACMD="java"
fi
exec "$JAVACMD" -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
SCRIPT
        chmod +x gradlew

    - name: Create debug keystore
      run: |
        cd android
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
          -storepass android -keypass android -keyalg RSA -keysize 2048 \
          -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        echo "storeFile=debug.keystore" > keystore.properties
        echo "storePassword=android" >> keystore.properties
        echo "keyAlias=androiddebugkey" >> keystore.properties
        echo "keyPassword=android" >> keystore.properties

    - name: Build Debug APK
      run: |
        cd android
        ./gradlew clean assembleDebug --no-daemon --stacktrace

    - name: Locate and verify APK
      id: locate_apk
      run: |
        cd android
        APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "Error: APK file not found!"
          find app/build -name "*.apk" || true
          exit 1
        fi
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "APK found at: $APK_PATH"
        cp "$APK_PATH" odin-assistant.apk
        ls -lh odin-assistant.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: odin-assistant.apk
        body: |
          🚀 **نسخه جدید اندروید منتشر شد!**

          ### تغییرات:
          - قفل سخت‌افزاری (Device Locking) فعال شد.
          - سیستم لایسنس جدید برای جلوگیری از کپی غیرمجاز.
          - بهبود پایداری و رفع باگ‌ها.

          ⚠️ **توجه:** این نسخه فقط روی دستگاهی که لایسنس برای آن صادر شده کار می‌کند.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact (for PRs or non-tag pushes)
      if: "!startsWith(github.ref, 'refs/tags/')"
      uses: actions/upload-artifact@v4
      with:
        name: Odin-Android-Debug
        path: odin-assistant.apk
        retention-days: 5

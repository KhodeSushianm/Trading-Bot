name: Build Android APK

on:
  push:
    branches: [ "android" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "android" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Create Gradle Wrapper
      run: |
        cd android
        mkdir -p gradle/wrapper
        echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        
    - name: Download Gradle Wrapper JAR
      run: |
        cd android
        curl -L -o gradle/wrapper/gradle-wrapper.jar \
          https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar
      
    - name: Create gradlew script
      run: |
        cd android
        printf '#!/bin/sh\nAPP_HOME=$(cd "$(dirname "$0")" && pwd -P)\nCLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar\nif [ -n "$JAVA_HOME" ] ; then\n    JAVACMD="$JAVA_HOME/bin/java"\nelse\n    JAVACMD="java"\nfi\nexec "$JAVACMD" -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"' > gradlew
        chmod +x gradlew

    - name: Create keystore properties (for debug build)
      run: |
        cd android
        echo "storeFile=debug.keystore" > keystore.properties
        echo "storePassword=android" >> keystore.properties
        echo "keyAlias=androiddebugkey" >> keystore.properties
        echo "keyPassword=android" >> keystore.properties
        
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build Debug APK with Gradle
      run: |
        cd android
        ./gradlew clean assembleDebug --stacktrace --no-daemon

    - name: Locate APK
      id: locate_apk
      run: |
        cd android
        APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "Error: APK file not found!"
          find . -name "*.apk" || true
          exit 1
        fi
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "APK found at: $APK_PATH"
        cp "$APK_PATH" ./app-debug.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ./android/app-debug.apk
        body: |
          🚀 **نسخه جدید اندروید منتشر شد!**

          ### تغییرات:
          - قفل سخت‌افزاری (Device Locking) فعال شد.
          - سیستم لایسنس جدید برای جلوگیری از کپی غیرمجاز.
          - بهبود پایداری و رفع باگ‌ها.

          ⚠️ **توجه:** این نسخه فقط روی دستگاهی که لایسنس برای آن صادر شده کار می‌کند.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact (for PRs or non-tag pushes)
      if: "!startsWith(github.ref, 'refs/tags/')"
      uses: actions/upload-artifact@v4
      with:
        name: Odin-Android-Debug
        path: ./android/app-debug.apk
        retention-days: 5

name: Build Android APK

on:
  push:
    branches: [ "android" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "android" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Setup Gradle Wrapper
      run: |
        cd android
        # Create gradle wrapper directory
        mkdir -p gradle/wrapper
        
        # Create gradle-wrapper.properties
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF

        # Create gradlew script
        cat > gradlew << 'GRADLEW_SCRIPT'
#!/bin/sh
APP_HOME=$(cd "$(dirname "$0")" && pwd -P)
CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
if [ -n "$JAVA_HOME" ] ; then
    JAVACMD="$JAVA_HOME/bin/java"
else
    JAVACMD="java"
fi
exec "$JAVACMD" -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
GRADLEW_SCRIPT
        chmod +x gradlew

        # Download gradle-wrapper.jar
        echo "Downloading Gradle Wrapper JAR..."
        curl -L -o gradle/wrapper/gradle-wrapper.jar \
          https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar

    - name: Create keystore properties (for debug build)
      run: |
        cd android
        cat > keystore.properties << 'KEYSTORE_PROPS'
storeFile=debug.keystore
storePassword=android
keyAlias=androiddebugkey
keyPassword=android
KEYSTORE_PROPS
        
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build Debug APK with Gradle
      run: |
        cd android
        ./gradlew clean assembleDebug --stacktrace --no-daemon

    - name: Locate APK
      id: locate_apk
      run: |
        cd android
        APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "Error: APK file not found!"
          find . -name "*.apk" || true
          exit 1
        fi
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "APK found at: $APK_PATH"
        cp "$APK_PATH" ./app-debug.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ./android/app-debug.apk
        body: |
          🚀 **نسخه جدید اندروید منتشر شد!**

          ### تغییرات:
          - قفل سخت‌افزاری (Device Locking) فعال شد.
          - سیستم لایسنس جدید برای جلوگیری از کپی غیرمجاز.
          - بهبود پایداری و رفع باگ‌ها.

          ⚠️ **توجه:** این نسخه فقط روی دستگاهی که لایسنس برای آن صادر شده کار می‌کند.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact (for PRs or non-tag pushes)
      if: "!startsWith(github.ref, 'refs/tags/')"
      uses: actions/upload-artifact@v4
      with:
        name: Odin-Android-Debug
        path: ./android/app-debug.apk
        retention-days: 5

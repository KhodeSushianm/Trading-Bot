name: Tests (Python + Android JS)

# ── تغییر مسیر پروژه (۲۰۲۶-۰۹-۲۲) ────────────────────────────────────
# توسعهٔ نسخهٔ ویندوز «منجمد» شد: دیگر بیلد/ریلیز/قابلیت جدید ویندوزی نداریم.
# پس jobهای windows_guard و build-windows از این ورک‌فلو حذف شدند و تنها خروجی
# قابل‌توزیع، APK است (ورک‌فلو build-android.yml).
#
# ⚠️ این ورک‌فلو عمداً «نگه داشته» شده و فقط job تست را می‌دود، چون:
#   ۱) موتور پایتون هنوز اوراکلِ تستِ اپ اندروید است — tests/js/gen_fixtures.py
#      دوازده ماژول آن را import می‌کند تا فیکسچرِ ۲۴ تست برابری ساخته شود.
#      بدون این job، هیچ‌چیز درستیِ محاسبات موتور JS اندروید را نمی‌سنجد.
#   ۲) src/ui/theme.py هنوز منبع حقیقتِ ۴۱ توکن رنگ اندروید است
#      (smoke_theme_parity.js — ۲۰۸ بررسی).
#   ۳) src/app_paths.py منبع حقیقتِ versionName/versionCode اندروید است.
#   یعنی «انجماد ویندوز» ≠ «حذف پایتون». کد ویندوزی (panel.py، src/ui/،
#   installer/) سر جایش می‌ماند ولی بیلد نمی‌شود.
# ── فیلتر برنچ (v0.23.0) ────────────────────────────────────────────────
# چرا فقط ANDROID؟ هر سه برنچ (ANDROID/main/android) به تصمیم مالک نگه داشته
# شده‌اند و «همیشه روی یک کامیت» نگه داشته می‌شوند. پس اجرای تست روی هر سه،
# سه‌بار تستِ کدِ یکسان بود — اندازه‌گیری واقعی: ۲۷ ران تکراری و ~۵٫۶ دقیقه
# هدر در هر push.
#
# ⚠️ این بهینه‌سازی یک ریسک دارد: اگر کسی فقط به main یا android پوش کند،
#   تست‌ها بی‌صدا اجرا نمی‌شوند. برای همین workflow تازهٔ `branch-sync.yml`
#   اضافه شد که روی push به آن دو برنچ «واگرایی» را بلافاصله و با شکستِ
#   پرسروصدا گزارش می‌کند. یعنی پوشش از دست نرفته، بلکه جابه‌جا شده:
#     کد یکسان → یک‌بار تست کامل + نگهبانِ ارزانِ همگامی
#     واگرایی   → نگهبان قرمز می‌شود و می‌گوید همگام کنید
#
# تگ‌ها عمداً هنوز این ورک‌فلو را بیدار می‌کنند: تست‌های پایتون «اوراکل» موتور
# JS اندروید‌اند و باید پیش از انتشار APK سنجیده شوند (build-android.yml
# خودش main.py --selftest را اجرا نمی‌کند).
on:
  push:
    branches: [ANDROID]
    tags: ["v*"]
  pull_request:
    branches: [ANDROID, main, android]
  workflow_dispatch:

# اگر چند push پشت‌سرهم بیاید، اجرای قبلی لغو می‌شود (صف نمی‌سازد).
# group بر پایهٔ ref است تا دو «تگ» متفاوت همدیگر را لغو نکنند.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # فقط تست می‌دود؛ هیچ انتشاری ندارد (اصل کمینه‌بودن دسترسی)

jobs:
  # ── تست‌ها: موتور پایتون (اوراکل) + اسموک‌های اپ اندروید ──────
  # بدون GUI و بدون اینترنت. panel.py --selftest عمداً اینجا نیست: به Qt
  # نیاز دارد و نسخهٔ ویندوز منجمد شده، پس اجرايش هزینهٔ بی‌فایده است.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test dependencies
        # عمداً سبک: tradingview-ta و PySide6 برای خودآزمون‌ها لازم نیستند
        # (هر دو به‌صورت lazy داخل تابع ایمپورت می‌شوند).
        # yfinance از فاز ۳ اضافه شد: میخ‌های طلاییِ سوییچ engine
        # (tests/test_engine_switch.py) کلاس YahooSource را پچ می‌کنند — seam
        # مشترکِ قبل/بعد از سوییچ. yfinance وابستگی واقعیِ requirements.txt
        # است، پس CI حالا به تولید نزدیک‌تر است نه دورتر.
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy PyYAML requests feedparser yfinance

      - name: Backend selftest (offline — تقویم، اخبار، وتو، گزارش)
        run: python main.py --selftest

      - name: Config validation
        run: python tests/check_config.py

      # فاز ۱ معماری پلاگین: تست واحد هستهٔ src/core/ — آفلاین و سریع (<۱s).
      # هسته در این فاز به engine وصل نیست؛ این step از همان روز اول جلوی
      # پوسیدگی قراردادها/registry/resolver را می‌گیرد.
      - name: Core plugin-skeleton unit tests (آفلاین)
        run: python tests/test_core.py

      # فاز ۲ معماری پلاگین: تست‌های طلایی src/plugins/ — هر adapter باید
      # خروجی فراخوانی مستقیم را عیناً بازتولید کند. آفلاین (تست «نوع منبع
      # داده» با yfinance کامل می‌شود و بدون آن به‌طور طراحی‌شده skip است).
      - name: Plugin golden tests (adapter == direct call — آفلاین)
        run: python tests/test_plugins.py

      # فاز ۳ معماری پلاگین: میخ‌های رفتاری engine (قبل از سوییچ نوشته و سبز
      # شده‌اند؛ بعد از سوییچ باید بدون تغییر سبز بمانند). شامل مقایسهٔ چرخهٔ
      # کامل mock با tests/golden/run_cycle_golden.json — آفلاین.
      - name: Engine behavior pins + golden cycle (آفلاین)
        run: python tests/test_engine_switch.py

      # فاز ۴ معماری پلاگین: میخ‌های رفتاری قواعد داور (۷ وتو + ۸ شاهد +
      # ریاضی ریسک) — قبل از سوییچ به rule-plugin نوشته و سبز شده‌اند؛ بعد از
      # سوییچ باید بدون تغییر سبز بمانند. شامل باتری طلاییِ سناریوها
      # (tests/golden/judge_rules_golden.json — دادهٔ ساختگی قطعی، آفلاین).
      - name: Judge-rules behavior pins + golden battery (آفلاین)
        run: python tests/test_judge_rules.py

      # فاز ۳b معماری پلاگین: run_cycle روی PipelineRunner — ترتیب قطعیِ
      # ۱۱ مرحله + رویدادهای stage.* + early-exit = stop در journal_pre.
      # (طلاییِ رفتاریِ خودِ چرخه در step بالا سبز می‌ماند — بدون تغییر.)
      - name: Pipeline-switch stage events + stop semantics (آفلاین)
        run: python tests/test_pipeline_switch.py

      # سه‌گامِ استراتژی‌ها (v0.26 — S1): ۷۷ میخِ سه استراتژی ورود
      # (trend_pullback / london_breakout / carry) + قرارداد odin.strategy@1
      # + مسیر registry. ⚠️ این سوئیت پیش‌تر در CI نبود — در §۵ بستهٔ زمینه
      # «میخ» نامیده شده بود ولی اجرا نمی‌شد. از v0.29 الزامی است.
      - name: Strategies behavior pins (آفلاین)
        run: python tests/test_strategies.py

      # v0.29 فاز ۰: میخِ رفتاریِ تعیینِ نتیجهٔ سیگنال‌ها.
      # ⚠️ چرا این سوئیت حیاتی است: resolve_open_signals پیش‌تر *هیچ* تستِ
      # CI-محوری نداشت (تنها پوششش tests/manual/test_journal.py بود که اجرا
      # نمی‌شد). همان خلأ باعث شد باگِ «ورودِ کهنه» ناشناخته بماند و
      # کارنامهٔ دقت خوش‌بینانه گزارش شود (برد ۴ برابر و باخت ۲٫۵ برابر
      # کم‌برآورد — اندازه‌گیری‌شده در بخش C همین سوئیت).
      - name: Tracker behavior pins + stale-entry bias gauge (آفلاین)
        run: python tests/test_tracker.py

      # تست‌های JS اپ اندروید — چرا اینجا هم؟ چون job «test» روی ubuntu اجرا
      # می‌شود و سریع است؛ این‌طور یک کامیتِ «فقط ویندوزی» هم نمی‌تواند
      # پاریتی تم یا رانش نسخهٔ اندروید را بی‌صدا بشکند.
      - name: JS smoke tests (اپ اندروید)
        run: |
          node tests/js/smoke_about.js
          node tests/js/smoke_icons.js
          node tests/js/smoke_license.js
          node tests/js/smoke_alerts.js
          node tests/js/smoke_chart.js
          node tests/js/smoke_share.js
          node tests/js/smoke_theme_parity.js
          node tests/js/smoke_layout.js
          node tests/js/smoke_onboarding.js
          node tests/js/smoke_core.js
          node tests/js/smoke_plugins.js

      # فاز ۶ معماری پلاگین: میخ‌های رفتاری موتور JS (svcTick/cycleCore/
      # runPipeline) — قبل از سوییچ به پلاگین‌ها نوشته و سبز شده‌اند؛ بعد از
      # سوییچ باید بدون تغییر سبز بمانند. شامل ۸ سناریوی طلایی آفلاین
      # (tests/js/golden/cycle_core_golden.json — FakeDate ثابت، بدون شبکه).
      - name: JS engine behavior pins + golden cycle (آفلاین)
        run: node tests/js/test_cycle_switch.js

      # فاز ۶b معماری پلاگین: میخ‌های رفتاری قواعد داور JS (۷ وتو + ۸ شاهد
      # + ریاضی ریسک — ۵۸ سناریوی طلایی) قبل از rule-plugin شدن نوشته و سبز
      # شده‌اند؛ بعد از سوییچ باید بدون تغییر سبز بمانند.
      - name: JS judge-rules behavior pins + golden battery (آفلاین)
        run: node tests/js/test_judge_switch.js

      # v0.28 (۶c): واحدِ createPipelineAsync + توالی ۳۱/۷ رویدادِ چرخه —
      # آینهٔ test_pipeline_switch پایتون. ⚠️ پیش‌تر در CI نبود؛ از v0.29 الزامی.
      - name: JS pipeline-events pins (آفلاین)
        run: node tests/js/test_pipeline_events.js

      # v0.26 (S2): پاریتیِ بایت‌به‌بایتِ آینهٔ ES5 استراتژی‌ها با اوراکلِ
      # پایتون — ۷۸ سناریو / ۵۷۴ بررسی، بزرگ‌ترین سوئیت JS ریپو.
      # ⚠️ پیش‌تر در CI نبود؛ از v0.29 الزامی.
      - name: JS strategies parity pins (آفلاین)
        run: node tests/js/test_strategies_switch.js

      - name: Data-dir logic test (پرتابل vs نصب‌شده)
        run: python tests/manual/test_paths_install.py

      - name: Byte-compile all sources
        run: python -m compileall -q src panel.py main.py

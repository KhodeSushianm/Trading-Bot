name: Tests (Python + Android JS)

# ── تغییر مسیر پروژه (۲۰۲۶-۰۹-۲۲) ────────────────────────────────────
# توسعهٔ نسخهٔ ویندوز «منجمد» شد: دیگر بیلد/ریلیز/قابلیت جدید ویندوزی نداریم.
# پس jobهای windows_guard و build-windows از این ورک‌فلو حذف شدند و تنها خروجی
# قابل‌توزیع، APK است (ورک‌فلو build-android.yml).
#
# ⚠️ این ورک‌فلو عمداً «نگه داشته» شده و فقط job تست را می‌دود، چون:
#   ۱) موتور پایتون هنوز اوراکلِ تستِ اپ اندروید است — tests/js/gen_fixtures.py
#      دوازده ماژول آن را import می‌کند تا فیکسچرِ ۲۴ تست برابری ساخته شود.
#      بدون این job، هیچ‌چیز درستیِ محاسبات موتور JS اندروید را نمی‌سنجد.
#   ۲) src/ui/theme.py هنوز منبع حقیقتِ ۴۱ توکن رنگ اندروید است
#      (smoke_theme_parity.js — ۲۰۸ بررسی).
#   ۳) src/app_paths.py منبع حقیقتِ versionName/versionCode اندروید است.
#   یعنی «انجماد ویندوز» ≠ «حذف پایتون». کد ویندوزی (panel.py، src/ui/،
#   installer/) سر جایش می‌ماند ولی بیلد نمی‌شود.
on:
  push:
    branches: [main, ANDROID, android]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read   # فقط تست می‌دود؛ هیچ انتشاری ندارد (اصل کمینه‌بودن دسترسی)

jobs:
  # ── تست‌ها: موتور پایتون (اوراکل) + اسموک‌های اپ اندروید ──────
  # بدون GUI و بدون اینترنت. panel.py --selftest عمداً اینجا نیست: به Qt
  # نیاز دارد و نسخهٔ ویندوز منجمد شده، پس اجرايش هزینهٔ بی‌فایده است.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test dependencies
        # عمداً سبک: yfinance، tradingview-ta و PySide6 برای خودآزمون لازم نیستند
        # (هر سه به‌صورت lazy داخل تابع ایمپورت می‌شوند)
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy PyYAML requests feedparser

      - name: Backend selftest (offline — تقویم، اخبار، وتو، گزارش)
        run: python main.py --selftest

      - name: Config validation
        run: python tests/check_config.py

      # تست‌های JS اپ اندروید — چرا اینجا هم؟ چون job «test» روی ubuntu اجرا
      # می‌شود و سریع است؛ این‌طور یک کامیتِ «فقط ویندوزی» هم نمی‌تواند
      # پاریتی تم یا رانش نسخهٔ اندروید را بی‌صدا بشکند.
      - name: JS smoke tests (اپ اندروید)
        run: |
          node tests/js/smoke_about.js
          node tests/js/smoke_icons.js
          node tests/js/smoke_license.js
          node tests/js/smoke_alerts.js
          node tests/js/smoke_chart.js
          node tests/js/smoke_share.js
          node tests/js/smoke_theme_parity.js
          node tests/js/smoke_layout.js
          node tests/js/smoke_onboarding.js

      - name: Data-dir logic test (پرتابل vs نصب‌شده)
        run: python tests/manual/test_paths_install.py

      - name: Byte-compile all sources
        run: python -m compileall -q src panel.py main.py

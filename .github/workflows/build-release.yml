name: Tests & Build Windows EXE

# تست‌ها روی هر push و PR اجرا می‌شوند (سریع، بدون ساخت EXE).
# ساخت و انتشار EXE فقط روی تگ v* یا اجرای دستی.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── تست‌های سریع (بدون GUI، بدون اینترنت) ───────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test dependencies
        # عمداً سبک: yfinance، tradingview-ta و PySide6 برای خودآزمون لازم نیستند
        # (هر سه به‌صورت lazy داخل تابع ایمپورت می‌شوند)
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy PyYAML requests feedparser

      - name: Backend selftest (offline — تقویم، اخبار، وتو، گزارش)
        run: python main.py --selftest

      - name: Config validation
        run: python tests/check_config.py

      - name: Byte-compile all sources
        run: python -m compileall -q src panel.py main.py

  # ── ساخت و انتشار EXE ویندوز ─────────────────────────────────
  build-windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Panel selftest (offscreen GUI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python panel.py --selftest

      - name: Build EXE (PyInstaller)
        run: pyinstaller ForexAssistant.spec --noconfirm

      - name: Smoke test (offscreen GUI + engine selftest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\dist\ForexAssistant.exe --selftest

      - name: Rename artifact with version
        shell: pwsh
        run: Rename-Item -Path dist/ForexAssistant.exe -NewName "ForexAssistant-${{ github.ref_name }}-windows.exe"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: نسخه ${{ github.ref_name }} — پنل ویندوز (ForexAssistant)
          body: |
            ## 🆕 چه چیزی در این نسخه اضافه شد؟

            ### ⚖️ داور امتیازدهی (Confluence) — مغز تصمیم‌گیر پروژه
            همهٔ مدارک (تکنیکال، تریدینگ‌ویو، تقویم اقتصادی، اخبار، قدرت ارزها، سشن)
            حالا در یک داور جمع‌بندی می‌شوند. سیگنال فقط وقتی صادر می‌شود که
            **هیچ وتویی فعال نباشد** و **امتیاز ≥ ۷ از ۱۱** شود.

            ### 🚫 ۷ دروازهٔ وتو (بدون استثنا — حتی با امتیاز کامل)
            🔒 بازار بسته (شنبه/یکشنبه) · 📅 رویداد پراثر در ۳۰ دقیقه آینده ·
            🔀 تضاد جهت تایم‌فریم‌ها · 😴 بازار بی‌روند (ADX پایین) ·
            📈 جهش غیرعادی نوسان · 🚨 خبر فوری · ⚠️ دادهٔ ناکافی

            ### 🎯 سیگنال کامل با دلایل
            - 📍 ورود · 🛑 حد ضرر (از روی **سطح کلیدی** + ATR، با کف و سقف امن) · 🎯 هدف با نسبت ۱:۲
            - ✅ فهرست مدارکی که امتیاز گرفتند **و** مدارکی که نگرفتند (شفافیت کامل)
            - ⚠️ هشدارهای هوشمند، مثلاً «حمایت سر راه هدف است»

            ### 🔕 ضداسپم
            حلقه هر ۱۵ دقیقه است؛ یک ستاپ چندساعته قبلاً ۱۶ بار می‌رفت!
            حالا همان سیگنال تا ۱۸۰ دقیقه تکرار نمی‌شود، مگر اینکه امتیازش
            حداقل ۲ واحد بهتر شده باشد.

            ### 🔎 «چرا سیگنال نداد؟»
            در گزارش، سرنوشت **همهٔ ۷ نماد** نوشته می‌شود — حتی آن‌هایی که رد شدند.
            اگر امتیاز ناکافی بود، فهرست «✅ داشت / ➖ نداشت» را می‌بینی.
            سیگنال ندادن یک خروجی معتبر است، نه خرابی.

            ### 🖥️ پنل
            - تب جدید **«🎯 سیگنال‌ها»** (جمعاً ۵ تب)
            - نوار وضعیت: سیگنال‌های این چرخه، مجموع، و موارد تکراریِ ارسال‌نشد

            ### 🧪 حالت شبیه‌سازی (خط فرمان)
            `python main.py --as-of "2026-09-17 14:00"` — داور را در یک روز کاری
            بسنج حتی وقتی بازار بسته است. **هیچ پیامی به تلگرام نمی‌رود** و
            بنر «حالت شبیه‌سازی» بالای گزارش چاپ می‌شود.

            ### 📔 زیرساخت ژورنال (برای مرحله ۴)
            هر سیگنال در `logs/signals.jsonl` ثبت می‌شود (ورود/SL/TP/امتیاز/مدارک،
            با `outcome: null`). مرحلهٔ بعد نتیجه‌شان را پیگیری و آمار دقت را می‌سازد.

            > ⚠️ **مهم و صادقانه:** آستانهٔ ۷ از ۱۱ یک عدد **بهینه‌شده نیست** —
            > یک نقطهٔ شروع محتاطانه است. برای فهمیدن اینکه واقعاً چقدر دقیق است،
            > باید ژورنال (مرحله ۴) چند هفته داده جمع کند. این ابزار مشاور مالی نیست.

                        ## 📥 راهنمای نصب (۲ دقیقه)

            1. فایل **`ForexAssistant-...-windows.exe`** را از بخش Assets پایین همین صفحه دانلود کن
            2. آن را در یک **پوشه اختصاصی** بگذار (مثلاً `Desktop\ForexAssistant`) — برنامه در اولین اجرا `config.yaml` و پوشه‌های `logs` و `data/cache` را کنار خودش می‌سازد
            3. رویش دابل‌کلیک کن. اگر هشدار آبی **SmartScreen** ویندوز آمد: **More info → Run anyway** (برای برنامه‌های امضان‌شده طبیعی است)
            4. در بخش **تلگرام**: توکن بات را از `@BotFather` بگیر و وارد کن → دکمه **«📥 گرفتن خودکار شناسه»** → **«✅ ارسال پیام تست»**
            5. دکمه **«▶ شروع ربات»** را بزن — از این پس هر ۱۵ دقیقه گزارش کامل (تکنیکال + تقویم + اخبار) به تلگرامت می‌رسد 📱

            > ⏳ اجرای اول ۱۰ تا ۲۰ ثانیه طول می‌کشد (استخراج فایل‌های فشرده) — طبیعی است.
            > 🔤 فونت ایران‌سنس: فایل فونت را در پوشه `fonts` کنار EXE بگذار و برنامه را باز کن — خودکار جای وزیرمتن فعال می‌شود.
            > ⚠️ این ابزار فقط تحلیل و سیگنال می‌دهد و هیچ معامله‌ای انجام نمی‌دهد؛ تصمیم با شماست.
          files: dist/ForexAssistant-*.exe
          draft: false
          prerelease: false

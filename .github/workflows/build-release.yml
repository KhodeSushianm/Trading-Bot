name: Tests & Build Windows EXE

# تست‌ها روی هر push و PR اجرا می‌شوند (سریع، بدون ساخت EXE).
# ساخت و انتشار (نصب‌کننده + EXE پرتابل) فقط روی تگ v* یا اجرای دستی.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      debug_smoke:
        description: "1 = اسموک‌تست به‌جای شکست، شواهد کامل چاپ می‌کند"
        default: ""

permissions:
  contents: write

jobs:
  # ── تست‌های سریع (بدون GUI، بدون اینترنت) ───────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test dependencies
        # عمداً سبک: yfinance، tradingview-ta و PySide6 برای خودآزمون لازم نیستند
        # (هر سه به‌صورت lazy داخل تابع ایمپورت می‌شوند)
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy PyYAML requests feedparser

      - name: Backend selftest (offline — تقویم، اخبار، وتو، گزارش)
        run: python main.py --selftest

      - name: Config validation
        run: python tests/check_config.py

      - name: Data-dir logic test (پرتابل vs نصب‌شده)
        run: python tests/manual/test_paths_install.py

      - name: Byte-compile all sources
        run: python -m compileall -q src panel.py main.py

  # ── نگهبان: تگِ برنچ اندروید نباید بیلد ویندوز بسازد ────────
  # چرا: تگ‌های v* از برنچ android هم این ورک‌فلو را بیدار می‌کنند و در آن حالت
  #   job «Publish GitHub Release» نام و متن ریلیز اندروید را با متن ویندوز
  #   بازنویسی می‌کند و EXEهای ویندوزِ ساخته‌شده از کدِ برنچ اندروید را به آن
  #   می‌چسباند (اتفاقی که برای v0.9.0 افتاد). پس فقط وقتی تگ روی main هم
  #   قابل‌دسترس باشد بیلد ویندوز اجرا می‌شود.
  # حالت خطا: اگر بررسی نسبیت با خطا (نه «نه»ی قطعی) مواجه شود، build=true
  #   می‌ماند تا انتشار ویندوزِ برنچ main هرگز بی‌صدا از کار نیفتد.
  windows_guard:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.chk.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is this tag reachable from main?
        id: chk
        run: |
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "not a tag push (ref=${{ github.ref }}) — Windows build allowed"
            exit 0
          fi
          TAG_SHA=$(git rev-list -n 1 "${{ github.ref }}")
          git fetch --no-tags origin main
          MAIN_SHA=$(git rev-parse FETCH_HEAD)
          echo "tag ${{ github.ref_name }} -> $TAG_SHA ; main -> $MAIN_SHA"
          set +e
          git merge-base --is-ancestor "$TAG_SHA" "$MAIN_SHA"
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag ${{ github.ref_name }} is not on main (Android release) — skipping the Windows build."
            echo "tag is NOT reachable from main -> skipping Windows build"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "tag is reachable from main (rc=$rc) -> Windows build allowed"
          fi

  # ── ساخت و انتشار نصب‌کننده + EXE ویندوز ────────────────────
  build-windows:
    needs: [test, windows_guard]
    if: >-
      (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') &&
      needs.windows_guard.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Resolve version & stamp Windows file info
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v?(\d+\.\d+\.\d+(?:[.\-+][0-9A-Za-z.\-]+)?)$') { $v = $Matches[1] }
          else { $v = (python -c "from src import app_paths; print(app_paths.APP_VERSION)").Trim() }
          python installer/stamp_version.py $v
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Panel selftest (offscreen GUI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python panel.py --selftest

      - name: Build EXE (PyInstaller)
        run: pyinstaller ODINAssistant.spec --noconfirm

      - name: Smoke test (offscreen GUI + engine selftest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\dist\ODINAssistant.exe --selftest

      - name: Locate (or install) Inno Setup
        id: iscc
        shell: pwsh
        run: |
          $p = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $p)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $p)) { throw "Inno Setup (ISCC.exe) not found" }
          "path=$p" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: '& "${{ steps.iscc.outputs.path }}" /DAppVersion=${{ steps.ver.outputs.version }} installer\odin.iss'

      - name: Installer smoke test (silent install + uninstall)
        env:
          DEBUG_SMOKE: ${{ github.event.inputs.debug_smoke }}
        shell: pwsh
        run: |
          # دام شمارهٔ ۱: اینو ستاپ اگر پوشهٔ مسیر /LOG وجود نداشته باشد،
          #   نمی‌تواند لاگ بسازد و بی‌سروصدا با «Setup failed to initialize»
          #   (کد خروج 1) خارج می‌شود؛ پس اول $dir را می‌سازیم.
          # دام شمارهٔ ۲: اگر اینو سطح دسترسی عوض کند، فرزند detached می‌سازد و
          #   پدر فوراً خارج می‌شود؛ پس معیار اصلی poll روی فایل‌های نصب است و
          #   کد خروج فقط برای شکستِ زودهنگامِ غیرصفر به کار می‌رود.
          $dir = Join-Path $env:RUNNER_TEMP "OdinSmokeTest"
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $setup = Get-ChildItem installer\Output\*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "installer output missing" }
          "launching: $($setup.FullName)"
          "target dir: $dir"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList `
            "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/NOICONS", `
            "/DIR=$dir","/LOG=$dir\setup.log" -PassThru
          $ok = $false
          $deadline = (Get-Date).AddSeconds(240)
          while ((Get-Date) -lt $deadline) {
            if ((Test-Path "$dir\ODINAssistant.exe") -and (Test-Path "$dir\.installed") -and
                (Test-Path "$dir\unins000.exe")) { $ok = $true; break }
            if ($p.HasExited -and $p.ExitCode -ne 0) {
              "---- evidence: dir listing ----"
              Get-ChildItem $dir -Recurse -Force -ErrorAction SilentlyContinue |
                Select-Object -First 40 -ExpandProperty FullName
              "---- evidence: setup.log ----"
              Get-Content "$dir\setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 50
              throw "setup exited early with code $($p.ExitCode)"
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) {
            "---- evidence: dir listing ----"
            Get-ChildItem $dir -Recurse -Force -ErrorAction SilentlyContinue |
              Select-Object -First 60 -ExpandProperty FullName
            "---- evidence: setup.log ----"
            Get-Content "$dir\setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 50
            throw "silent install did not produce artifacts in 240s"
          }
          "install artifacts OK"
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList `
            "/VERYSILENT","/NORESTART","/LOG=$dir\unins.log" -PassThru
          $gone = $false
          $deadline = (Get-Date).AddSeconds(180)
          while ((Get-Date) -lt $deadline) {
            if (-not (Test-Path "$dir\ODINAssistant.exe")) { $gone = $true; break }
            if ($u.HasExited -and $u.ExitCode -ne 0) {
              "---- evidence: unins.log ----"
              Get-Content "$dir\unins.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
              throw "uninstaller exited early with code $($u.ExitCode)"
            }
            Start-Sleep -Seconds 2
          }
          if (-not $gone) {
            "---- evidence: unins.log ----"
            Get-Content "$dir\unins.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
            throw "silent uninstall did not remove the EXE in 180s"
          }
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\ODINAssistant.exe") { throw "uninstall left the EXE behind" }
          "uninstall OK — smoke test passed"

      - name: Rename portable artifact with version
        shell: pwsh
        run: Rename-Item -Path dist/ODINAssistant.exe -NewName "ODINAssistant-v${{ steps.ver.outputs.version }}-windows.exe"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ODIN Assistant ${{ github.ref_name }} — نصب‌کنندهٔ ویندوز + نسخهٔ پرتابل"
          body: |
            ## ⚙️ تازه در v0.8.1 — صفحهٔ تنظیمات کامل در پنل ویندوز (آینهٔ نسخهٔ اندروید + بیشتر)

            همهٔ تغییرات **فوری** در `config.local.yaml` ذخیره می‌شوند و **بدون ری‌استارت** اثر می‌کنند.

            | بخش | چه چیزی عوض می‌شود |
            |---|---|
            | 🪪 شخصی‌سازی | نام نمایشی — فوراً در هدر، آواتار و Splash |
            | ⚖️ داور | روشن/خاموش، آستانهٔ صدور سیگنال (۴–۱۰)، حداکثر سیگنال در هر چرخه (۱–۵) |
            | 🚫 دروازه‌های وتو | کلید مستقل برای هر ۶ دروازه: بازار بسته، رویداد پراثر تقویم، تضاد تایم‌فریم، بازار بی‌روند، جهش غیرعادی نوسان، خبر فوری |
            | 🔧 موتورها | تقویم اقتصادی، هشدار رویداد نزدیک، موتور اخبار، تأییدیهٔ تریدینگ‌ویو |
            | 🔁 حلقه و گزارش‌ها | فاصلهٔ تحلیل خودکار (۵–۱۲۰ دقیقه)، بریفینگ صبحگاهی، کارنامه (ژورنال)، قانون محافظه‌کارانهٔ «هر دو لمس» |
            | 🎨 ظاهر | صفحهٔ خوش‌آمدگویی (Splash)، انیمیشن‌ها |
            | 📨 تلگرام | توکن ربات و شناسهٔ چت (مثل قبل) |
            | 🧹 داده‌ها | پاک‌کردن کش تقویم اقتصادی، **بازنشانی همهٔ تنظیمات** (تلگرام و ژورنال پاک نمی‌شوند) |

            ## 📦 دو خروجی در Assets (پایین همین صفحه)
            ### ۱) `ODINAssistant-...-windows-setup.exe` — نصب‌کنندهٔ رسمی (پیشنهادی) 
            - نصب تمیز ویندوزی: منوی استارت + آیکون دسکتاپ (اختیاری) + حذف از Settings → Apps
            - انتخاب بین «نصب برای همهٔ کاربران» (Program Files) یا «فقط کاربر جاری»
            - داده‌ها (config، توکن تلگرام، لاگ‌ها، ژورنال) در پوشهٔ استاندارد
              `%APPDATA%\ODIN Assistant` — نه داخل Program Files
            ### ۲) `ODINAssistant-...-windows.exe` — نسخهٔ پرتابل تک‌فایلی (مثل قبل)
            - در هر پوشه‌ای بگذارید و اجرا کنید؛ همهٔ داده‌ها کنار خودش می‌ماند

            ## 🧭 مهاجرت از نسخهٔ پرتابل قدیمی (ForexAssistant ≤ v0.7.2)
            ژورنال و تنظیمات تلگرام شما باارزش‌اند؛ بعد از نصب، این دو فایل را از پوشهٔ
            قدیمی به `%APPDATA%\ODIN Assistant` کپی کنید:
            `config.local.yaml` (توکن/شناسه تلگرام) و `logs\signals.jsonl` (ژورنال).
            بقیهٔ فایل‌ها (config.yaml، کش) خودکار ساخته می‌شوند.

            ## 🗂️ تاریخچه
            ### v0.8.0
            - 🆕 نصب‌کنندهٔ رسمی اینو‌ستاپ + اسمارت‌اسکرین‌پسند (بدون امضا: More info → Run anyway)
            - 🆕 منطق «پوشهٔ داده‌ها»: حالت نصب‌شده → `%APPDATA%`؛ حالت پرتابل → کنار EXE
              (با فایل اختیاری `.portable` می‌توان حتی داخل Program Files پرتابل ماند)
            - 🆕 آیکون و منابع VERSIONINFO ویندوز (Properties → Details حالا نسخه دارد)
            - 🔒 همهٔ رفع‌باگ‌های ظاهری v0.7.2 سر جایشان‌اند (تست رگرسیون دارند)
            - 🪪 نام برنامه رسماً **ODIN Assistant** شد (عنوان پنجره، Splash، آیکون مونوگرام Ø، نام فایل‌ها و پوشهٔ نصب)

            > ⚠️ هشدار آبی SmartScreen برای برنامه‌های امضانشده طبیعی است:
            > **More info → Run anyway**. این ابزار فقط تحلیل/سیگنال می‌دهد و معامله نمی‌کند.
          files: |
            dist/ODINAssistant-*.exe
            installer/Output/ODINAssistant-*-setup.exe
          draft: false
          prerelease: false

name: Tests & Build Windows EXE

# تست‌ها روی هر push و PR اجرا می‌شوند (سریع، بدون ساخت EXE).
# ساخت و انتشار (نصب‌کننده + EXE پرتابل) فقط روی تگ v* یا اجرای دستی.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      debug_smoke:
        description: "1 = اسموک‌تست به‌جای شکست، شواهد کامل چاپ می‌کند"
        default: ""

permissions:
  contents: write

jobs:
  # ── تست‌های سریع (بدون GUI، بدون اینترنت) ───────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test dependencies
        # عمداً سبک: yfinance، tradingview-ta و PySide6 برای خودآزمون لازم نیستند
        # (هر سه به‌صورت lazy داخل تابع ایمپورت می‌شوند)
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy PyYAML requests feedparser

      - name: Backend selftest (offline — تقویم، اخبار، وتو، گزارش)
        run: python main.py --selftest

      - name: Config validation
        run: python tests/check_config.py

      - name: Data-dir logic test (پرتابل vs نصب‌شده)
        run: python tests/manual/test_paths_install.py

      - name: Byte-compile all sources
        run: python -m compileall -q src panel.py main.py

  # ── ساخت و انتشار نصب‌کننده + EXE ویندوز ────────────────────
  build-windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Resolve version & stamp Windows file info
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v?(\d+\.\d+\.\d+(?:[.\-+][0-9A-Za-z.\-]+)?)$') { $v = $Matches[1] }
          else { $v = (python -c "from src import app_paths; print(app_paths.APP_VERSION)").Trim() }
          python installer/stamp_version.py $v
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Panel selftest (offscreen GUI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python panel.py --selftest

      - name: Build EXE (PyInstaller)
        run: pyinstaller ODINAssistant.spec --noconfirm

      - name: Smoke test (offscreen GUI + engine selftest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\dist\ODINAssistant.exe --selftest

      - name: Locate (or install) Inno Setup
        id: iscc
        shell: pwsh
        run: |
          $p = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $p)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $p)) { throw "Inno Setup (ISCC.exe) not found" }
          "path=$p" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: '& "${{ steps.iscc.outputs.path }}" /DAppVersion=${{ steps.ver.outputs.version }} installer\odin.iss'

      - name: Installer smoke test (silent install + uninstall)
        env:
          DEBUG_SMOKE: ${{ github.event.inputs.debug_smoke }}
        shell: pwsh
        run: |
          # /CURRENTUSER: در سشن بدون UAC رانر، نصب elevation نمی‌خواهد؛
          # مسیر هم داخل RUNNER_TEMP است که قطعاً قابل‌نوشتن است
          $dir = Join-Path $env:RUNNER_TEMP "OdinSmokeTest"
          $setup = Get-ChildItem installer\Output\*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "installer output missing" }
          # Start-Process -Wait: کد خروج معتبر برای برنامهٔ GUI + لاگ اینو ستاپ
          $p = Start-Process -FilePath $setup.FullName -Wait -PassThru -ArgumentList `
            "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/NOICONS", `
            "/DIR=$dir","/LOG=$dir\setup.log"
          if ($p.ExitCode -ne 0) {
            "---- evidence: dir listing ----"
            Get-ChildItem $dir -Recurse -Force -ErrorAction SilentlyContinue |
              Select-Object -First 60 -ExpandProperty FullName
            "---- evidence: setup.log ----"
            Get-Content "$dir\setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 50
            if ($env:DEBUG_SMOKE -eq "1") {
              "---- evidence: elevation / OS ----"
              ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
              [System.Environment]::OSVersion.VersionString
              "---- evidence: defender threats ----"
              Get-MpThreatDetection -ErrorAction SilentlyContinue | Format-List -Property Resources, ActionSuccess
              "---- evidence: application event log (errors, 10min) ----"
              Get-WinEvent -FilterHashtable @{LogName='Application'; Level=1,2; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue |
                Select-Object -First 15 TimeCreated, ProviderName, Id, Message | Format-List
              "---- evidence: second attempt via cmd ----"
              $dir2 = Join-Path $env:RUNNER_TEMP "OdinSmoke2"
              cmd /c "`"$($setup.FullName)`" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOICONS /DIR=$dir2 /LOG=$dir2\setup.log & echo CMD_EXIT=%ERRORLEVEL%"
              Get-Content "$dir2\setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 50
              "---- evidence: minimal args attempt ----"
              $dir3 = Join-Path $env:RUNNER_TEMP "OdinSmoke3"
              $p3 = Start-Process -FilePath $setup.FullName -Wait -PassThru -ArgumentList "/VERYSILENT","/DIR=$dir3","/LOG=$dir3\setup.log"
              "exit3=$($p3.ExitCode)"
              Get-Content "$dir3\setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 50
            } else {
              throw "silent install failed (exit $($p.ExitCode))"
            }
          }
          if (-not (Test-Path "$dir\ODINAssistant.exe")) { throw "installed EXE missing" }
          if (-not (Test-Path "$dir\.installed")) { throw ".installed marker missing (installed-mode broken)" }
          $u = Start-Process -FilePath "$dir\unins000.exe" -Wait -PassThru -ArgumentList `
            "/VERYSILENT","/NORESTART","/LOG=$dir\unins.log"
          if ($u.ExitCode -ne 0) {
            Get-Content "$dir\unins.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
            throw "silent uninstall failed (exit $($u.ExitCode))"
          }
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\ODINAssistant.exe") { throw "uninstall left the EXE behind" }

      - name: Rename portable artifact with version
        shell: pwsh
        run: Rename-Item -Path dist/ODINAssistant.exe -NewName "ODINAssistant-v${{ steps.ver.outputs.version }}-windows.exe"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ODIN Assistant ${{ github.ref_name }} — نصب‌کنندهٔ ویندوز + نسخهٔ پرتابل"
          body: |
            ## 🪪 نام جدید: ODIN Assistant
            از این نسخه نام برنامه رسماً **ODIN Assistant** شد: عنوان پنجره، Splash،
            آیکون جدید (مونوگرام Ø)، نام فایل‌ها و پوشهٔ نصب — همه با برند جدید.

            ## 📦 دو خروجی در Assets (پایین همین صفحه)
            ### ۱) `ODINAssistant-...-windows-setup.exe` — نصب‌کنندهٔ رسمی (پیشنهادی) 
            - نصب تمیز ویندوزی: منوی استارت + آیکون دسکتاپ (اختیاری) + حذف از Settings → Apps
            - انتخاب بین «نصب برای همهٔ کاربران» (Program Files) یا «فقط کاربر جاری»
            - داده‌ها (config، توکن تلگرام، لاگ‌ها، ژورنال) در پوشهٔ استاندارد
              `%APPDATA%\ODIN Assistant` — نه داخل Program Files
            ### ۲) `ODINAssistant-...-windows.exe` — نسخهٔ پرتابل تک‌فایلی (مثل قبل)
            - در هر پوشه‌ای بگذارید و اجرا کنید؛ همهٔ داده‌ها کنار خودش می‌ماند

            ## 🧭 مهاجرت از نسخهٔ پرتابل قدیمی (ForexAssistant ≤ v0.7.2)
            ژورنال و تنظیمات تلگرام شما باارزش‌اند؛ بعد از نصب، این دو فایل را از پوشهٔ
            قدیمی به `%APPDATA%\ODIN Assistant` کپی کنید:
            `config.local.yaml` (توکن/شناسه تلگرام) و `logs\signals.jsonl` (ژورنال).
            بقیهٔ فایل‌ها (config.yaml، کش) خودکار ساخته می‌شوند.

            ## 🗂️ چه چیزی عوض شد (v0.8.0)
            - 🆕 نصب‌کنندهٔ رسمی اینو‌ستاپ + اسمارت‌اسکرین‌پسند (بدون امضا: More info → Run anyway)
            - 🆕 منطق «پوشهٔ داده‌ها»: حالت نصب‌شده → `%APPDATA%`؛ حالت پرتابل → کنار EXE
              (با فایل اختیاری `.portable` می‌توان حتی داخل Program Files پرتابل ماند)
            - 🆕 آیکون و منابع VERSIONINFO ویندوز (Properties → Details حالا نسخه دارد)
            - 🔒 همهٔ رفع‌باگ‌های ظاهری v0.7.2 سر جایشان‌اند (تست رگرسیون دارند)

            > ⚠️ هشدار آبی SmartScreen برای برنامه‌های امضانشده طبیعی است:
            > **More info → Run anyway**. این ابزار فقط تحلیل/سیگنال می‌دهد و معامله نمی‌کند.
          files: |
            dist/ODINAssistant-*.exe
            installer/Output/ODINAssistant-*-setup.exe
          draft: false
          prerelease: false

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E7E7EC">
<title>ODIN ASSISTANT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- پس‌زمینهٔ گرادیان محو (مثل paintEvent دسکتاپ) -->
<div id="bg" aria-hidden="true"></div>

<!-- Splash: کارت مشکی «خوش اومدی سوشیان» -->
<div id="splash" class="hidden">
  <div class="splash-card">
    <div class="splash-logo">
      <svg viewBox="0 0 48 48" width="52" height="52" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
        <path d="M24 4v8M24 36v8M8 24H4M44 24h-4"/>
        <circle cx="24" cy="24" r="10"/>
        <path d="M24 14a10 10 0 0 1 0 20" fill="#fff" stroke="none"/>
      </svg>
    </div>
    <div class="splash-brand" dir="ltr">ODIN ASSISTANT</div>
    <div class="splash-name" id="splash-name">خوش اومدی!</div>
    <div class="splash-sub">دستیار تحلیل فارکس و طلا — بدون معاملهٔ خودکار</div>
    <div class="splash-ver" id="splash-ver">v0.17.0 · android</div>
  </div>
</div>

<div id="app" class="hidden">
  <!-- هدر -->
  <header id="hdr">
    <div class="hdr-main">
      <div>
        <div id="greet">سلام!</div>
        <div id="appsub">ODIN ASSISTANT · تحلیل و سیگنال · غیرخودکار</div>
      </div>
      <div class="hdr-side">
        <div id="clock" class="clock-pill">—</div>
        <button class="circle-btn" id="btn-settings" aria-label="تنظیمات">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="3.2"/>
            <path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="hdr-status"></div>
  </header>

  <!-- صفحه‌ها -->
  <main id="pages">
    <section class="page" id="page-home"></section>
    <section class="page hidden" id="page-signals"></section>
    <section class="page hidden" id="page-calendar"></section>
    <section class="page hidden" id="page-news"></section>
    <section class="page hidden" id="page-journal"></section>
    <section class="page hidden" id="page-settings"></section>
    <section class="page hidden" id="page-briefing"></section>
    <section class="page hidden" id="page-about"></section>
    <section class="page hidden" id="page-chart"></section>
  </main>

  <!-- نوار تب پایین — کارت شناور سفید، تب فعال پیِل مشکی -->
  <nav id="tabbar">
    <button class="tab" data-tab="home">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.8l8.5 6.7V20a1 1 0 0 1-1 1h-4.6v-5.6H9.1V21H4.5a1 1 0 0 1-1-1z"/></svg>
      <span>خانه</span>
    </button>
    <button class="tab" data-tab="signals">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 3 5 6.5l1.7 3.4M12 3l7 3.5-1.7 3.4M5 6.5 3 17.5c0 2 4 3.5 9 3.5s9-1.5 9-3.5L19 6.5M12 7v14"/></svg>
      <span>سیگنال‌ها</span>
      <i class="badge hidden" id="badge-signals"></i>
    </button>
    <button class="tab" data-tab="calendar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.6"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>تقویم</span>
    </button>
    <button class="tab" data-tab="news">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13a1 1 0 0 1 1 1v13a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z"/><path d="M7.5 9h6M7.5 12.5h6M7.5 16h3.5"/></svg>
      <span>اخبار</span>
      <i class="badge hidden" id="badge-news"></i>
    </button>
    <button class="tab" data-tab="journal">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 1 6.5 18H19v3H6.5A1.5 1.5 0 0 1 5 19.5zM9 7.5h6"/></svg>
      <span>ژورنال</span>
    </button>
  </nav>
</div>

<!-- پیشرفت تحلیل -->
<div id="progress-root" class="hidden">
  <div class="progress-card">
    <div class="progress-head">
      <div class="spinner"></div>
      <div id="progress-title">در حال تحلیل...</div>
    </div>
    <div id="progress-log"></div>
    <button id="progress-close" class="btn hidden">بستن</button>
  </div>
</div>

<!-- مودال -->
<div id="modal-root" class="hidden">
  <div class="modal-card">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<!-- تست -->
<div id="toast-root" class="hidden"></div>

<script src="js/md5.js"></script>
<script src="js/fa.js"></script>
<script src="js/icons.js"></script>
<script src="js/license.js"></script>
<script src="js/config.js"></script>
<script src="js/indicators.js"></script>
<script src="js/session.js"></script>
<script src="js/technical.js"></script>
<script src="js/calendar.js"></script>
<script src="js/news.js"></script>
<script src="js/judge.js"></script>
<script src="js/journal.js"></script>
<script src="js/data.js"></script>
<script src="js/alerts.js"></script>
<script src="js/chart.js"></script>
<script src="js/briefing.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>

# ══════════════════════════════════════════════════════════════
#  پیکربندی دستیار سیگنال فارکس  (نسخه وب — بدون وابستگی به متاتریدر)
#  این فایل را می‌توانید با هر ویرایشگر متنی (مثل Notepad) تغییر دهید
# ══════════════════════════════════════════════════════════════

# منبع داده:
#   auto        = Yahoo (اصلی) و در صورت شکست، Twelve Data (اگر کلید داشته باشد)  ← پیشنهاد
#   yahoo       = فقط Yahoo Finance (بدون کلید)
#   twelvedata  = فقط Twelve Data (نیاز به کلید رایگان)
data_source: auto

# ── نمادهای تحت پوشش ──────────────────────────────────────────
# yahoo: نماد در Yahoo Finance | td: نماد در Twelve Data | tv: نماد در تریدینگ‌ویو
symbols:
  - name: EURUSD
    fa: "یورو به دلار آمریکا"
    yahoo: "EURUSD=X"
    td: "EUR/USD"
    tv: {screener: forex, exchange: FX, symbol: EURUSD}
    base: EUR
    quote: USD
    pip: 0.0001

  - name: GBPUSD
    fa: "پوند به دلار آمریکا"
    yahoo: "GBPUSD=X"
    td: "GBP/USD"
    tv: {screener: forex, exchange: FX, symbol: GBPUSD}
    base: GBP
    quote: USD
    pip: 0.0001

  - name: USDJPY
    fa: "دلار آمریکا به ین ژاپن"
    yahoo: "USDJPY=X"
    td: "USD/JPY"
    tv: {screener: forex, exchange: FX, symbol: USDJPY}
    base: USD
    quote: JPY
    pip: 0.01

  - name: USDCAD
    fa: "دلار آمریکا به دلار کانادا"
    yahoo: "USDCAD=X"
    td: "USD/CAD"
    tv: {screener: forex, exchange: FX, symbol: USDCAD}
    base: USD
    quote: CAD
    pip: 0.0001

  - name: AUDUSD
    fa: "دلار استرالیا به دلار آمریکا"
    yahoo: "AUDUSD=X"
    td: "AUD/USD"
    tv: {screener: forex, exchange: FX, symbol: AUDUSD}
    base: AUD
    quote: USD
    pip: 0.0001

  - name: USDCHF
    fa: "دلار آمریکا به فرانک سوئیس"
    yahoo: "USDCHF=X"
    td: "USD/CHF"
    tv: {screener: forex, exchange: FX, symbol: USDCHF}
    base: USD
    quote: CHF
    pip: 0.0001

  - name: XAUUSD
    fa: "طلا به دلار آمریکا (انس)"
    yahoo: "GC=F"        # فیوچرز طلا (Yahoo اسپات ندارد) — اختلاف جزئی با اسپات طبیعی است
    td: "XAU/USD"        # با کلید Twelve Data: اسپات واقعی
    tv: {screener: cfd, exchange: OANDA, symbol: XAUUSD}
    base: XAU
    quote: USD
    pip: 1.0             # برای طلا هر واحد = ۱ دلار (در گزارش با $ نمایش داده می‌شود)

# ── تنظیمات موتور تکنیکال ─────────────────────────────────────
analysis:
  ema_fast: 50            # میانگین متحرک سریع (تشخیص روند)
  ema_slow: 200           # میانگین متحرک کند
  adx_period: 14
  adx_min_trend: 20       # زیر این مقدار = بازار بی‌روند (وتو)
  adx_strong: 25
  rsi_period: 14
  atr_period: 14
  swing_window: 5         # پنجره تشخیص قله/کف (سطوح حمایت و مقاومت)
  strength_lookback_h1: 24   # بازه محاسبه قدرت ارزها (کندل یک‌ساعته ≈ ۲۴ ساعت)

# ── تاریخچه مورد نیاز ─────────────────────────────────────────
history:
  yahoo_h1_days: 60       # Yahoo: چند روز داده یک‌ساعته (H4 از آن ساخته می‌شود)
  yahoo_m15_days: 5
  td_m15_bars: 200        # Twelve Data: تعداد کندل هر تایم‌فریم
  td_h1_bars: 300
  td_h4_bars: 400
  drop_forming_candle: true   # کندل در حال تشکیل نادیده گرفته شود (تحلیل فقط روی کندل بسته)

# ── تاییدیه تریدینگ‌ویو ────────────────────────────────────────
# API غیررسمی (بدون لاگین) — اگر از دسترس خارج شد، برنامه بدون آن به کارش ادامه می‌دهد
tradingview:
  enabled: true
  timeframe: 4h           # تایم‌فریم تاییدیه: 15m | 1h | 4h | 1D

# ── Twelve Data (زاپاس اختیاری) ────────────────────────────────
# کلید رایگان: در https://twelvedata.com ثبت‌نام کنید (فقط ایمیل) و کلید را اینجا بگذارید
# بدون کلید، این منبع به‌صورت خودکار غیرفعال است و برنامه با Yahoo کار می‌کند
twelvedata:
  api_key: ""
  min_request_gap_sec: 8  # محدودیت tier رایگان: ۸ درخواست در دقیقه

# ══════════════════════════════════════════════════════════════
#  مرحله ۲ — موتور فاندامنتال و اخبار
# ══════════════════════════════════════════════════════════════

# ── تقویم اقتصادی ──────────────────────────────────────────────
# منبع: فید JSON هفتگی ForexFactory (رایگان، بدون کلید، بدون ثبت‌نام)
# ⚠️ این فید فقط «هفتهٔ جاری» (شنبه تا جمعه) را پوشش می‌دهد
fundamental:
  enabled: true
  source_url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
  cache_ttl_minutes: 30      # چند دقیقه دادهٔ کش‌شده معتبر است (کمتر = درخواست بیشتر)
  horizon_hours: 48          # در گزارش، رویدادهای چند ساعت آینده نمایش داده شود
  veto_minutes_before: 30    # 🔴 وتو: رویداد پراثر تا این دقیقه آینده → سیگنال آن نماد ممنوع
  alerts_enabled: true       # هشدار تلگرامی قبل از رویداد پراثر
  alert_before_minutes: 30   # چند دقیقه قبل از رویداد هشدار بدهد
  alert_grace_minutes: 10    # اگر برنامه تازه روشن شد، تا این دقیقه بعد از رویداد هم هشدار بده

# ── موتور اخبار (RSS) ──────────────────────────────────────────
# اگر feeds را خالی/حذف کنید، فیدهای پیش‌فرض استفاده می‌شوند:
#   ForexLive · Investing.com (فارکس/اقتصاد/طلا) · FXStreet از مسیر Google News
# ⚠️ فید مستقیم FXStreet و DailyFX دسترسی رباتیک را می‌بندد (۴۰۳)؛ برای همین
#    FXStreet از مسیر Google News RSS خوانده می‌شود که پایدارتر است.
news:
  enabled: true
  max_age_hours: 30          # خبر قدیمی‌تر از این = بی‌فایده (و فید کهنه تشخیص داده می‌شود)
  min_score: 2               # حداقل امتیاز اهمیت برای ورود به گزارش (۰ تا ۶)
  max_items_per_feed: 12
  max_total: 18              # حداکثر چند خبر در گزارش
  # feeds:                   # ← برای سفارشی‌سازی، این بخش را باز کنید
  #   - {name: ForexLive, url: "https://www.forexlive.com/feed", weight: 2}

# ── بریفینگ صبحگاهی 🌅 ─────────────────────────────────────────
# گزارش مستقل و خلاصه، قبل از باز شدن بازار لندن (۰۷:۰۰–۰۸:۰۰ UTC)
briefing:
  enabled: true
  times_utc: ["06:30"]       # می‌توانید چند ساعت بگذارید: ["06:30", "12:00"]
  horizon_hours: 24          # رویدادهای ۲۴ ساعت آینده
  catchup_window_minutes: 90 # اگر برنامه دیر روشن شد، تا این قدر دیرتر بریفینگ را بفرست

# ── تلگرام ─────────────────────────────────────────────────────
# ⚠️ توکن و شناسه چت را مستقیم اینجا ننویسید! پنل گرافیکی آن‌ها را در فایل
#    امن config.local.yaml ذخیره می‌کند که هرگز به گیت‌هاب push نمی‌شود.
telegram:
  send_reports: true
  bot_token: ""     # از طریق پنل پر می‌شود (@BotFather)
  chat_id: ""       # از طریق پنل پر می‌شود (دکمه «گرفتن خودکار»)

# ── حلقه اجرای خودکار (دکمه «شروع ربات» در پنل) ────────────────
loop:
  interval_minutes: 15   # فاصله بین تحلیل‌های خودکار
